[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "vigie-databricks-foundation"
version = "0.1.0"
description = "Slice 0 foundation for the Databricks Vigie project"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8.4,<9",
  "PyYAML>=6.0,<7",
]

[tool.pytest.ini_options]
addopts = "-q --strict-markers"
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["src/vigie_databricks"]
