[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "vigie-databricks-foundation"
version = "0.6.4"
description = "Databricks implementation of the Vigie insurer monitoring pipeline"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "databricks-sdk>=0.32,<1",
  "PyYAML>=6.0,<7",
  "requests>=2.32,<3",
  "pypdf>=5.9,<6",
]

[project.scripts]
bronze = "vigie_databricks.tasks.bronze:main"
silver = "vigie_databricks.tasks.silver:main"
gold = "vigie_databricks.tasks.gold:main"
finance_publish = "vigie_databricks.tasks.finance_publish:main"
finance_live = "vigie_databricks.tasks.finance_live:main"
news_bronze = "vigie_databricks.tasks.news_bronze:main"
news_silver = "vigie_databricks.tasks.news_silver:main"
news_ai_enrichment = "vigie_databricks.tasks.news_ai:main"
news_gold = "vigie_databricks.tasks.news_gold:main"

[project.optional-dependencies]
dev = [
  "pytest>=8.4,<9",
  "PyYAML>=6.0,<7",
]
local_spark = [
  "pyspark>=3.5,<4",
  "delta-spark>=3.2,<4",
]
databricks_connect = [
  "databricks-connect==17.3.*",
]

[tool.pytest.ini_options]
addopts = "-q --strict-markers"
testpaths = ["tests"]
markers = [
  "local_spark: optional local Spark JVM tests",
  "databricks_connect: Databricks Connect integration tests from VS Code",
  "databricks_runtime: Databricks runtime acceptance smoke tests",
]

[tool.hatch.build.targets.wheel]
packages = ["src/vigie_databricks"]
