command: ["streamlit", "run", "app.py"]

env:
  - name: "DATABRICKS_WAREHOUSE_ID"
    valueFrom: "sql_warehouse"
  - name: "VIGIE_CHAT_ENDPOINT"
    valueFrom: "vigie_chat_endpoint"
  - name: "GOLD_CATALOG"
    value: "workspace"
  - name: "GOLD_SCHEMA"
    value: "vigie"
  - name: "GOLD_TABLE"
    value: "gold_observations"
  - name: "SILVER_TABLE"
    value: "silver_observations"
  - name: "GOLD_NEWS_TABLE"
    value: "official_news"
  - name: "NEWS_AI_AUDIT_TABLE"
    value: "news_ai_run_audit"
  - name: "FINANCE_DOCUMENTS_TABLE"
    value: "financial_documents"
  - name: "FINANCE_AUDIT_TABLE"
    value: "finance_run_audit"
  - name: "STREAMLIT_BROWSER_GATHER_USAGE_STATS"
    value: "false"
