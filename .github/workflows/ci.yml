name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      # Spark 3.5 (Hadoop 3.3.4) fails on the runner's newer default Java
      # (Subject.getSubject is unsupported); pin the Java it supports.
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      # Test modules import Spark-backed production code during collection,
      # even when Databricks-only tests are deselected by their marker.
      - run: python -m pip install -e ".[dev,local_spark]"
      - run: python -m pytest -m "not databricks_connect and not databricks_runtime" -q
